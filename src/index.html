<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>Pixel Juggle</title>
</head>

<body>
    <div id="app">
        <header id="controls">
            <label for="siteswap-input">Siteswap</label>
            <input id="siteswap-input" type="text" autocomplete="off" autocapitalize="off"

        <canvas id="juggle-canvas"></canvas>
    </div>
</body>

</html>
