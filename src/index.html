<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>Pixel Juggle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Londrina+Sketch&family=Plaster&family=Turret+Road:wght@200;400;700&family=Asimovian&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
</head>

<body class="mode-menu">
    <div id="app">
        <!-- Menu screen: siteswap picker + Show me/Let me try - hidden once a
             demo or game is running (see body.mode-demo/mode-game in index.less). -->
        <div id="title-screen">
            <h1 id="game-title">PiXel JuGGle</h1>
            <div id="pattern-picker">
                <!-- Purple disc between the ::before/::after orbs and the
                     controls - only two pseudos available, so the face gets
                     its own element rather than sharing ::after. -->
                <div class="pattern-picker-disc" aria-hidden="true"></div>
                <div id="pattern-select-wrap">
                    <button type="button" id="pattern-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="pattern-name"></span>
                        <span class="material-symbols-outlined pattern-select-caret" aria-hidden="true">expand_more</span>
                    </button>
                    <ul id="pattern-select-list" class="pattern-select-list hidden" role="listbox"></ul>
                </div>
                <div id="custom-input-wrap" class="hidden">
                        <input id="siteswap-input" type="text" autocomplete="off" autocapitalize="off"
                            autocorrect="off" spellcheck="false" placeholder="e.g. 531">
                        <span id="validation-icon" class="hidden" title="">
                            <span class="material-symbols-outlined" aria-hidden="true"></span>
                        </span>
                    </div>
                    <div id="menu-buttons">
                        <button id="show-me-button" class="action-button secondary" disabled>
                            <span class="material-symbols-outlined button-icon" aria-hidden="true">visibility</span> Show me
                        </button>
                        <button id="try-button" class="action-button primary" disabled>
                            <span class="material-symbols-outlined button-icon" aria-hidden="true">person_play</span> Let me try
                        </button>
                    </div>
                </div>
            </div>
        <div id="canvas-area">
            <canvas id="juggle-canvas"></canvas>
            <div id="beat-bar-wrap" class="hidden">
                <div id="beat-bar"></div>
            </div>
            <div id="bpm-control">
                <label for="bpm-slider">BPM</label>
                <div id="bpm-slider-wrap">
                    <input id="bpm-slider" type="range" min="20" max="100" step="1" value="60">
                </div>
                <div id="bpm-value">60</div>
            </div>
        </div>
        <!-- Demo/game chrome: replaces the old text Stop/Restart buttons and
             the whole idle-state header once something is actually running
             (see body.mode-demo/mode-game in index.less). -->
        <div id="game-controls">
            <button id="mute-button" class="icon-button" title="Mute">
                <span class="material-symbols-outlined" aria-hidden="true">volume_up</span>
            </button>
            <button id="restart-button" class="icon-button" title="Restart (R)">
                <span class="material-symbols-outlined" aria-hidden="true">undo</span>
            </button>
            <button id="stop-button" class="icon-button" title="Stop">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>
    </div>
</body>

</html>
