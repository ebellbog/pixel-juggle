<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>Pixel Juggle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Londrina+Sketch&family=Plaster&family=Turret+Road:wght@200;400;700;800&family=Asimovian&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
</head>

<body class="mode-menu">
    <div id="app">
        <div id="title-screen">
            <h1 id="game-title" data-text="PiXel JuGGle">PiXel JuGGle</h1>
            <div id="pattern-picker">
                <div class="menu-orb menu-orb--stripes-a" aria-hidden="true"></div>
                <div class="menu-orb menu-orb--stripes-b" aria-hidden="true"></div>
                <div class="menu-orb menu-orb--dots" aria-hidden="true"></div>
                <div id="picker-panels-viewport">
                    <button type="button" id="picker-back-button" class="icon-button" title="Back to menu" aria-hidden="true">
                        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                    </button>
                    <div id="picker-panels-track">
                        <div id="picker-main-panel" class="picker-panel" data-picker-panel="main">
                            <div id="pattern-select-wrap">
                                <button type="button" id="pattern-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                                    <span class="pattern-name"></span>
                                    <span class="material-symbols-outlined pattern-select-caret" aria-hidden="true">expand_more</span>
                                </button>
                            </div>
                            <div id="custom-input-wrap" class="hidden">
                                <input id="siteswap-input" type="text" autocomplete="off" autocapitalize="off"
                                    autocorrect="off" spellcheck="false" placeholder="e.g. 531">
                                <span id="validation-icon" class="hidden" title="">
                                    <span class="material-symbols-outlined" aria-hidden="true"></span>
                                </span>
                            </div>
                            <div id="menu-spacer"></div>
                            <div id="menu-buttons">
                                <button type="button" class="action-button" data-action="show-me" disabled>
                                    <span class="material-symbols-outlined button-icon" aria-hidden="true">visibility</span> Visualize
                                </button>
                                <button type="button" class="action-button" data-action="try" disabled>
                                    <span class="material-symbols-outlined button-icon" aria-hidden="true">person_play</span> Juggle
                                </button>
                                <button type="button" class="action-button" data-action="tutorial" disabled>
                                    <span class="material-symbols-outlined button-icon" aria-hidden="true">school</span> Tutorial
                                </button>
                                <button type="button" class="action-button" data-action="leaderboard">
                                    <span class="material-symbols-outlined button-icon" aria-hidden="true">leaderboard</span> Scores
                                </button>
                            </div>
                        </div>
                        <!-- Difficulty pick - slides in from the right when "Juggle"
                             is pressed (see App.setPickerPanel). -->
                        <div id="picker-difficulty-panel" class="picker-panel" data-picker-panel="difficulty">
                            <div class="picker-panel-button-row">
                                <button type="button" class="action-button" data-action="difficulty-easier">Easier</button>
                                <button type="button" class="action-button" data-action="difficulty-normal">Normal</button>
                                <button type="button" class="action-button" data-action="difficulty-harder">Harder</button>
                            </div>
                            <button type="button" class="action-button action-button-muted-full-width" data-action="practice">
                                Practice mode
                            </button>
                        </div>
                        <!-- Tutorial pick - slides in from the right when "Tutorial"
                             is pressed (see App.setPickerPanel). -->
                        <div id="picker-tutorial-panel" class="picker-panel" data-picker-panel="tutorial">
                            <button type="button" class="action-button action-button-muted-full-width" data-action="interactive-tutorial">
                                Interactive tutorial
                            </button>
                            <div class="picker-panel-button-row">
                                <button type="button" class="action-button" data-action="tutorial-controls">Controls</button>
                                <button type="button" class="action-button" data-action="tutorial-siteswap-basics">Siteswap basics</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Portaled outside #pattern-picker (position: fixed and a
                 transformed ancestor don't mix - transform on an ancestor
                 creates a new containing block for fixed descendants, so
                 the list would position relative to the picker's centered,
                 translated box instead of the viewport; see
                 App.positionPatternSelectList). -->
            <ul id="pattern-select-list" class="pattern-select-list hidden" role="listbox"></ul>
            <div id="title-credits">
                <div>Designed by Elana Bell Bogdan, 2026</div>
                <button type="button" id="credits-link" class="text-button">See full credits</button>
            </div>
        </div>
        <div id="canvas-area">
            <canvas id="juggle-canvas"></canvas>
            <div id="beat-bar-wrap" class="hidden">
                <div id="beat-bar"></div>
            </div>
            <div id="game-stats">
                <!-- Practice mode: correct-throw streak/best (see
                     body.mode-competitive in index.less, which swaps to
                     #competitive-stat-group below instead). -->
                <div id="practice-stat-group" class="stat-group">
                    <div class="stat stat-before">
                        <span class="stat-label">Streak</span>
                        <span id="streak-value" class="stat-value">0</span>
                    </div>
                    <div class="stat-divider" aria-hidden="true"></div>
                    <div class="stat stat-after">
                        <span class="stat-label">Best</span>
                        <span id="max-streak-value" class="stat-value">0</span>
                    </div>
                </div>
                <!-- Competitive mode (easier/normal/harder): a single,
                     larger score stat in place of the streak/best pair
                     above (see Game's isCompetitive). -->
                <div id="competitive-stat-group" class="stat-group">
                    <div class="stat stat-score stat-large">
                        <span class="stat-label">Score</span>
                        <span id="score-value" class="stat-value">0</span>
                    </div>
                </div>
            </div>
            <!-- Competitive mode's "get back in the groove" grace-window
                 countdown (see Game.updateGrooveCountdown) - big red
                 numerals animating over the center of the canvas. -->
            <div id="groove-countdown" class="hidden" aria-hidden="true">
                <span id="groove-countdown-value"></span>
            </div>
            <div id="bpm-control">
                <label for="bpm-slider">BPM</label>
                <div id="bpm-slider-wrap">
                    <input id="bpm-slider" type="range" min="20" max="100" step="1" value="60">
                </div>
                <div id="bpm-value">60</div>
            </div>
        </div>
        <!-- Demo/game chrome: replaces the old text Stop/Restart buttons and
             the whole idle-state header once something is actually running
             (see body.mode-demo/mode-game in index.less). Material Symbols
             Outlined at a light weight (see .material-symbols-outlined above)
             gives the large, thin look the old Font Awesome setup was
             approximating. -->
        <button id="settings-button" class="icon-button" title="Settings">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
        </button>
        <div id="game-controls">
            <button id="mute-button" class="icon-button" title="Mute">
                <span class="material-symbols-outlined" aria-hidden="true">volume_up</span>
            </button>
            <button id="restart-button" class="icon-button" title="Restart (R)">
                <span class="material-symbols-outlined" aria-hidden="true">undo</span>
            </button>
            <button id="stop-button" class="icon-button" title="Stop">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>

        <!-- Settings modal - toggled by #settings-button, visible in every
             mode (see App.openSettings/closeSettings). -->
        <div id="settings-overlay" class="app-modal-overlay hidden">
            <div id="settings-modal" class="app-modal">
                <button id="settings-close-button" class="icon-button app-modal-close" title="Close">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
                <h2 id="settings-title" class="app-modal-title">Settings</h2>

                <div class="settings-group">
                    <div class="settings-group-label">Height control</div>
                    <div class="settings-option-row" data-setting="inputType">
                        <button type="button" class="settings-option" data-value="hold">Hold</button>
                        <button type="button" class="settings-option" data-value="tap">Tap</button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-group-label">UI labels</div>
                    <div class="settings-toggle-row">
                        <button type="button" class="settings-toggle" data-setting="uiLabelHands">Hands</button>
                        <button type="button" class="settings-toggle" data-setting="uiLabelHeights">Heights</button>
                        <button type="button" class="settings-toggle" data-setting="uiLabelHotkeys">Hotkeys</button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-group-label">Background effects</div>
                    <div class="settings-option-row" data-setting="backgroundEffect">
                        <button type="button" class="settings-option" data-value="fluid">Fluid</button>
                        <button type="button" class="settings-option" data-value="bokeh">Bokeh</button>
                        <button type="button" class="settings-option" data-value="off">Off</button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-group-label">Sound effects</div>
                    <div class="settings-toggle-row">
                        <button type="button" class="settings-toggle" data-setting="soundPercussion">Beats</button>
                        <button type="button" class="settings-toggle" data-setting="soundThrowTones">Throws</button>
                        <button type="button" class="settings-toggle" data-setting="soundButtons">UI</button>
                    </div>
                </div>

                <button id="settings-reset-button" class="text-button modal-footer-button">Reset to defaults</button>
            </div>
        </div>

        <!-- Credits/Controls/Siteswap basics/Scores/Game Over modals are
             rendered here at startup from src/templates/*-modal.handlebars
             (see App.renderContentModals) - each is a thin Handlebars
             partial block "inheriting" the shared shell in
             src/templates/partials/modal.handlebars. -->
    </div>
</body>

</html>
