<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <title>Pixel Juggle</title>
</head>

<body>
    <div id="app">
        <header id="controls">
            <label for="siteswap-input">Siteswap</label>
            <input id="siteswap-input" type="text" autocomplete="off" autocapitalize="off"
                autocorrect="off" spellcheck="false" placeholder="e.g. 531" value="3">
            <div id="validation-message"></div>
            <div id="action-buttons">
                <button id="show-me-button" class="action-button secondary" disabled>Show me</button>
                <button id="try-button" class="action-button primary" disabled>Let me try!</button>
                <button id="stop-button" class="action-button stop hidden">Stop</button>
            </div>
        </header>
        <div id="canvas-area">
            <canvas id="juggle-canvas"></canvas>
            <div id="beat-bar-wrap" class="hidden">
                <div id="beat-bar"></div>
            </div>
            <div id="bpm-control">
                <label for="bpm-slider">BPM</label>
                <div id="bpm-slider-wrap">
                    <input id="bpm-slider" type="range" min="20" max="100" step="1" value="60">
                </div>
                <div id="bpm-value">60</div>
            </div>
        </div>
    </div>
</body>

</html>
